services:
  - type: static
    name: calificaciones-frontend
    env: static
    rootDir: Frontend-calificacionesOnlineGBD/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Ajusta esta URL si tu backend cambia de dominio o prefijo
        value: https://gestor-calificaciones.onrender.com/api

